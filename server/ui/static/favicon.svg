<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d6f7ff"/>
      <stop offset="55%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#003a55"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fundo arredondado -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGlow)"/>

  <!-- anel externo -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#blueGlow)"/>

  <!-- anel tracejado mediano -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- 6 segmentos triangulares (estilo arc reactor) -->
  <g stroke="#00d4ff" stroke-width="1" fill="rgba(0,212,255,0.08)" opacity="0.85">
    <polygon points="32,15 38,28 26,28" />
    <polygon points="32,49 38,36 26,36" />
    <polygon points="15,32 28,38 28,26" />
    <polygon points="49,32 36,38 36,26" />
    <polygon points="20,20 30,27 27,30" />
    <polygon points="44,44 34,37 37,34" />
  </g>

  <!-- core central -->
  <circle cx="32" cy="32" r="9" fill="url(#coreGrad)" filter="url(#blueGlow)"/>
  <!-- highlight -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
