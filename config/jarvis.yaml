user:
  name: "Bárbara"
  honorific: "Senhora"

terminal:
  # Terminal usado quando o Jarvis abre uma janela interativa (ex: rodar uma
  # skill do Claude Code). Valores aceitos:
  #   auto       → wt se disponível, senão cmd. Default seguro.
  #   wt         → Windows Terminal (pré-preenche o comando).
  #   cmd        → cmd.exe clássico (pré-preenche o comando).
  #   powershell → PowerShell (pré-preenche o comando).
  #   warp       → Warp via URI scheme. Limitação: não aceita comando inicial,
  #                então o Jarvis abre só no diretório e devolve o comando
  #                pra colar.
  preferred: "warp"

narrator:
  # Engines disponíveis: "edge_tts" (grátis, neural Microsoft) | "fish_audio" (pago)
  engine: "fish_audio"
  volume: 0.9
  edge_tts:
    # Vozes PT-BR neurais: pt-BR-AntonioNeural (masc), pt-BR-FranciscaNeural (fem),
    # pt-BR-ThalitaNeural (fem). Para Jarvis-style, use AntonioNeural.
    voice: "pt-BR-AntonioNeural"
    rate: "+0%"
    pitch: "+0Hz"

watchers:
  gitlab:
    enabled: true
    poll_interval_seconds: 1000

ui:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  auto_open: true  # abre Edge --app no boot

  fonts:
    body: '"Share Tech Mono", monospace'
    mono: '"Share Tech Mono", "Cascadia Mono", monospace'
    brand: '"Orbitron", sans-serif'
    imports:
      - https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wgh
        t@500;700&display=swap
hotkey:
  push_to_talk: "<ctrl>+<alt>+j"

commands:
  # Comandos custom mapeando frase → tool.action(params). Match por substring,
  # case-insensitive, no texto transcrito. Built-ins (pausa/próxima/etc.) já
  # funcionam sem configuração — entradas aqui só ADICIONAM ou customizam.
  - trigger: jarvis, pausar musica
    description: Pausar música
    tool: spotify
    action: pause
    params: {}
  - trigger: jarvis, retomar musica
    description: Retomar música
    tool: spotify
    action: resume
    params: {}
  - trigger: jarvis, passar musica
    description: Próxima música
    tool: spotify
    action: next
    params: {}
  - trigger: jarvis, voltar
    description: Música anterior
    tool: spotify
    action: previous
    params: {}
  - trigger: modo foco
    description: Toca minha playlist de foco
    tool: spotify
    action: play_playlist
    params:
      playlist: 
        https://open.spotify.com/playlist/37i9dQZF1DZ06evO49hLQA?si=b54f709b40364c09
  - trigger: jarvis, oque está tocando?
    description: Diz qual musica esta tocando
    tool: spotify
    action: current
    params: {}
  - trigger: to triste
    description: toca playlist quando estou triste
    tool: spotify
    action: play_playlist
    params:
      playlist: 
        https://open.spotify.com/playlist/37i9dQZF1DZ06evO49hLQA?si=b54f709b40364c09
  - trigger: Oi jarvis
    description: Saudação inicial (varia com a hora)
    tool: persona
    action: greet
    params: {}
  - trigger: minhas revisões
    description: MRs aguardando revisão
    tool: gitlab
    action: list_pending_reviews
    params: {}
  - trigger: minhas pendências
    description: Contagem de pendências do GitLab
    tool: gitlab
    action: count_pending
    params: {}
  - trigger: Olá
    description: ''
    tool: persona
    action: greet
    params: {}
  - trigger: Boa noite jarvis
    description: ''
    tool: persona
    action: greet
    params: {}
tools:
  claude_code:
    # Permite o agente abrir o Claude Code (CLI) num projeto específico com um
    # comando slash já pré-preenchido. Skills do Claude Code são interativas e
    # precisam rodar dentro de um diretório que tenha as definições instaladas
    # (`.claude/commands/<plugin>/`). O Jarvis pergunta qual projeto usar
    # quando você falar "rode /softflow:concept na MPC-158" e houver mais de
    # uma opção (ou cadastrar nenhuma).
    enabled: true
    projects:
      soft-suite-api: C:\Softplan\soft-suite-api
    # Exemplo:
    # projects:
    #   softflow: "C:/Users/barbara.pacheco/Documents/algum-projeto-com-softflow"
    #   jarvis: "~/Documents/jarvis"
      softflow: C:\Softplan\Utils\softflow
  spotify:
    enabled: true
  code_review:
    enabled: true
    dry_run: true  # true = apenas imprime o comando, não executa. Mude pra false quando quiser rodar de verdade.
    auto_clone: true  # se o projeto não tiver path, faz shallow clone em .jarvis_state/repos/
    # Templates por tipo de revisão. Adicione tipos custom aqui se quiser.
    commands:
      code: ["claude", "-p", "/hp:review branch:{source_branch}"]
      docs: ["claude", "-p", "Revise as mudanças no branch '{source_branch}' deste
            repositório de documentação. Use git para inspecionar o diff contra a
            branch padrão. Foco em: 1) erros ortográficos e gramaticais em português
            brasileiro; 2) inconsistências de coerência entre as alterações e o restante;
            3) afirmações ambíguas, desatualizadas ou contraditórias; 4) clareza e
            objetividade. Reporte findings citando arquivo e trecho. Seja conciso."]
    # Override por projeto. Sem entry → assume type=code com auto-clone.
    # Exemplos:
    #   "softplan/justica/algum-projeto":
    #     path: "C:/Users/barbara.pacheco/projects/algum-projeto"
    #     type: "code"
    project_dirs:
      "softplan/justica/ministerios-publicos/arquitetura-de-software/mp-docs":
        type: "docs"

stt:
  # Engine: "vosk" (rápido, fraco) | "whisper" (lento, muito preciso).
  engine: "whisper"
  # Modelo Vosk PT-BR. Usado se engine=vosk OU se wake word estiver ligado.
  # Baixar via `py scripts/setup_stt.py`.
  model_dir: ".jarvis_state/vosk_model_pt"
  whisper:
    # Tamanhos: tiny | base | small | medium | large-v3
    # small (~500MB) é o sweet-spot CPU. Baixa automaticamente no 1º uso.
    model_size: "small"
    device: "auto"        # "auto" | "cpu" | "cuda"
    compute_type: "auto"  # "auto" | "int8" | "int8_float16" | "float16" | "float32"
    language: "pt"
    beam_size: 1

agent:
  # Motor de raciocínio quando o dispatch local não casa nenhum keyword.
  # provider:
  #   "anthropic" → cloud, requer ANTHROPIC_API_KEY no .env. Tool calling robusto,
  #                 prompt caching ativo (reduz custo ~50% em conversas multi-turno).
  #   "ollama"    → roda local em localhost:11434 (grátis, privado). Use pra coisas
  #                 sensíveis da Softplan ou quando estiver offline. Pra trocar:
  #                 provider="ollama", model="llama3.2:3b" (ou qwen2.5:7b).
  enabled: true
  provider: "anthropic"
  model: "claude-haiku-4-5-20251001"
  base_url: "http://localhost:11434/v1"  # só é lido se provider=ollama

vault:
  # Cérebro persistente do Jarvis — vault de markdown local (compatível com Obsidian).
  # `root` aceita ~ (home) ou path absoluto. Se relativo, resolve a partir da pasta do projeto.
  # Conteúdo de perfil/ e projetos/ é injetado no system prompt do agente.
  # Interações ficam em interacoes/YYYY-MM-DD.md (append-only).
  enabled: true
  root: "~/Documents/jarvis-vault"

briefing:
  # Briefing matinal — Jarvis fala primeiro ao subir, se passou tempo suficiente
  # desde a última vez. Usa Claude API (mesma key do agente) e fala via TTS.
  # Aparece como turno especial 'Iniciativa' na view Conversa.
  enabled: true
  min_interval_hours: 6  # não dispara mais de uma vez nesse intervalo

wake_word:
  # Liga escuta contínua pra acordar pelo nome "Jarvis". Mic fica sempre aberto.
  # Coexiste com push-to-talk; ambos disparam o mesmo fluxo de comando.
  enabled: true
skills:
  disabled:
    - hp:dev
    - hp:publish
    - hp:qa
    - hp:review
    - hp:spec
