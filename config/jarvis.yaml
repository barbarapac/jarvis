user:
  name: "Bárbara"
  honorific: "Senhora"

narrator:
  # Engines disponíveis: "edge_tts" (grátis, neural Microsoft) | "fish_audio" (pago)
  engine: "fish_audio"
  volume: 0.9
  edge_tts:
    # Vozes PT-BR neurais: pt-BR-AntonioNeural (masc), pt-BR-FranciscaNeural (fem),
    # pt-BR-ThalitaNeural (fem). Para Jarvis-style, use AntonioNeural.
    voice: "pt-BR-AntonioNeural"
    rate: "+0%"
    pitch: "+0Hz"

watchers:
  gitlab:
    enabled: true
    poll_interval_seconds: 1000

ui:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  auto_open: true  # abre Edge --app no boot

hotkey:
  push_to_talk: "<ctrl>+<alt>+j"

tools:
  spotify:
    enabled: true
  code_review:
    enabled: true
    dry_run: true  # true = apenas imprime o comando, não executa. Mude pra false quando quiser rodar de verdade.
    auto_clone: true  # se o projeto não tiver path, faz shallow clone em .jarvis_state/repos/
    # Templates por tipo de revisão. Adicione tipos custom aqui se quiser.
    commands:
      code: ["claude", "-p", "/hp:review branch:{source_branch}"]
      docs: ["claude", "-p", "Revise as mudanças no branch '{source_branch}' deste repositório de documentação. Use git para inspecionar o diff contra a branch padrão. Foco em: 1) erros ortográficos e gramaticais em português brasileiro; 2) inconsistências de coerência entre as alterações e o restante; 3) afirmações ambíguas, desatualizadas ou contraditórias; 4) clareza e objetividade. Reporte findings citando arquivo e trecho. Seja conciso."]
    # Override por projeto. Sem entry → assume type=code com auto-clone.
    project_dirs: {}
    # Exemplos:
    # project_dirs:
    #   # Repo de docs — força type docs (default seria code)
    #   "softplan/justica/ministerios-publicos/arquitetura-de-software/mp-docs":
    #     type: "docs"
    #   # Repo onde já tenho clone local — usa esse path em vez do auto-clone
    #   "softplan/justica/algum-projeto":
    #     path: "C:/Users/barbara.pacheco/projects/algum-projeto"
    #     type: "code"
    project_dirs:                                                                                                                                         
      "softplan/justica/ministerios-publicos/arquitetura-de-software/mp-docs":                                                                            
        type: "docs"

stt:
  # Modelo Vosk PT-BR. Precisa ter sido baixado via `py scripts/setup_stt.py`.
  model_dir: ".jarvis_state/vosk_model_pt"
